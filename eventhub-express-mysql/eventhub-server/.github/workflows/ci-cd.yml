# ==========================================================================
# EventHub — CI/CD Pipeline
# OWNERSHIP: Member 3 (CI/CD)
#
# Pipeline shape:
#
#     lint ──┐
#            ├──→ build ──→ deploy ──→ verify
#     test ──┘   (scan +      (main       (prod
#                 smoke)      only)      /healthz)
#
# On a pull request:  lint + test + build/scan/smoke.  Nothing is published,
#                     nothing is deployed.  This is the gate for merging.
# On a push to main:  the same checks run, then the image is pushed to GHCR
#                     and rolled out to the server.
#
# Every job is deliberately small and named, so a red X in the Actions tab
# tells you *which stage* broke without opening the logs.
# ==========================================================================
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run a deploy by hand from the UI

# If you push twice in quick succession, cancel the older run. Saves CI
# minutes and stops two deploys racing each other onto the same server.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the default GITHUB_TOKEN gets only what each job needs.
permissions:
  contents: read

env:
  NODE_VERSION: "20"        # matches node:20-alpine in the Dockerfile

jobs:
  # ======================================================================
  # 1. LINT — fast feedback (~30s). Catches typos and undefined variables
  #    before we spend time spinning up a database.
  # ======================================================================
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # caches ~/.npm between runs

      - name: Install dependencies
        run: npm ci

      - name: Fail if .env is tracked in git
        # A committed .env is the single most common way student projects
        # leak database and SMTP credentials. Cheap check, high value.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is committed to the repository. Remove it with 'git rm --cached .env' and rotate every credential inside it."
            exit 1
          fi
          echo ".env is not tracked — good."

      - name: ESLint
        run: npm run lint

      - name: Compile every EJS template
        # Renders nothing — just proves no view has a syntax error. Without
        # this, a broken <%= %> only shows up as a 500 in the browser.
        run: npm run check:views

  # ======================================================================
  # 2. TEST — Jest + Supertest against a real MySQL 8 service container.
  #    Real database, not a mock: the routes are full of raw SQL, so a mock
  #    would prove nothing.
  # ======================================================================
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: eventhub
        ports:
          - 3306:3306
        # The job does not start until MySQL answers a ping. Without this,
        # the first test races the database and fails intermittently.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: eventhub
      SESSION_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema and migrations
        # NOTE: migration_add_profile_fields.sql is deliberately NOT applied.
        # schema.sql already creates avatar_url and bio, so running it would
        # fail with "Duplicate column name". The gender and orders migrations
        # ARE required — schema.sql does not contain them, but routes/auth.js,
        # routes/account.js and routes/ticketing.js all query them.
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p"$DB_PASSWORD" < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -p"$DB_PASSWORD" < database/migration_add_gender_field.sql
          mysql -h 127.0.0.1 -P 3306 -u root -p"$DB_PASSWORD" < database/migration_add_orders_table.sql

      - name: Seed demo data
        run: npm run seed

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()          # upload even when tests fail — that's when you need it
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ======================================================================
  # 3. BUILD — build the production image, prove it actually boots and
  #    serves traffic, scan it for CVEs, then publish (main only).
  # ======================================================================
  build:
    name: Build, smoke test & scan image
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write         # push to ghcr.io
      security-events: write  # upload Trivy results to the Security tab

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: eventhub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v5

      - name: Work out the image name
        id: image
        # GHCR rejects uppercase, and GitHub repo names can contain it.
        # ${VAR,,} lowercases the whole string in bash.
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "ref=ghcr.io/${REPO_LC}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true              # keep it on the runner so we can test it
          tags: eventhub:ci
          cache-from: type=gha    # reuse layers from previous runs
          cache-to: type=gha,mode=max

      - name: Prepare database for the smoke test
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci-root-password < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci-root-password < database/migration_add_gender_field.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci-root-password < database/migration_add_orders_table.sql

      - name: Start the container
        # --network host so the container can reach the MySQL service on
        # 127.0.0.1:3306 and we can curl it back on 127.0.0.1:3000.
        run: |
          docker run -d --name eventhub-ci --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_USER=root \
            -e DB_PASSWORD=ci-root-password \
            -e DB_NAME=eventhub \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            eventhub:ci

      - name: Smoke test
        # This is the step that catches "it works on my machine": wrong
        # CMD, missing file, app bound to 127.0.0.1 inside the container.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /tmp/health.json; then
              echo "healthz responded:"; cat /tmp/health.json; echo
              break
            fi
            [ "$i" = 30 ] && { echo "::error::App never became healthy"; exit 1; }
            sleep 2
          done

          grep -q '"db":"up"' /tmp/health.json || { echo "::error::App is up but cannot reach MySQL"; exit 1; }

          for path in / /login /register /definitely-not-a-real-page; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            echo "GET ${path} -> ${code}"
          done

          curl -fsS -o /dev/null http://127.0.0.1:3000/          || { echo "::error::Homepage failed"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/login     || { echo "::error::Login page failed"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/definitely-not-a-real-page)" = "404" ] \
            || { echo "::error::404 handler is not working"; exit 1; }

      - name: Container logs (on failure)
        if: failure()
        run: docker logs eventhub-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f eventhub-ci || true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eventhub:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # exit-code 0 = report but don't block. Once you've seen a few
          # clean runs, flip this to 1 so a CRITICAL CVE fails the build.
          exit-code: "0"

      - name: Scan image (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true   # code scanning needs a public repo or GHAS
        with:
          image-ref: eventhub:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif

      # ------------------------------------------------------------------
      # Evidence for the report: optimised image vs the naive baseline.
      # Skipped on PRs to keep them fast.
      # ------------------------------------------------------------------
      - name: Compare image size against the naive build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          docker build -f Dockerfile.naive -t eventhub:naive . > /dev/null 2>&1
          OPT=$(docker image inspect eventhub:ci    --format '{{.Size}}')
          NAI=$(docker image inspect eventhub:naive --format '{{.Size}}')
          {
            echo "### Image size"
            echo ""
            echo "| Build | Size |"
            echo "|---|---|"
            echo "| Naive (Dockerfile.naive) | $(numfmt --to=iec $NAI) |"
            echo "| Optimised (Dockerfile)   | $(numfmt --to=iec $OPT) |"
            echo "| **Reduction**            | **$(( 100 - OPT * 100 / NAI ))%** |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Publish — main only. PRs from forks cannot push, and shouldn't.
      # ------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # Two tags: the commit SHA (immutable — this is what we deploy and
        # what we roll back to) and `latest` (convenience only).
        run: |
          docker tag eventhub:ci "${{ steps.image.outputs.ref }}"
          docker tag eventhub:ci "${{ steps.image.outputs.repo }}:latest"
          docker push "${{ steps.image.outputs.ref }}"
          docker push "${{ steps.image.outputs.repo }}:latest"
          echo "Pushed \`${{ steps.image.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ======================================================================
  # 4. DEPLOY — main only. Pulls the exact SHA-tagged image onto the server
  #    and restarts the container. Rolls back automatically if the new
  #    container does not become healthy.
  #
  #    Required repo secrets:
  #      DEPLOY_HOST      server IP or hostname
  #      DEPLOY_USER      ssh user (must be in the docker group)
